[project]
name = "intro-mpi"
version = "0.1.0"
description = "Introduction to MPI lecture: slide deck builder (Keynote, Beamer, PowerPoint) and exercises"
requires-python = ">=3.10"
dependencies = [
    "pygments>=2.14",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false  # scripts only, nothing to install

[dependency-groups]
figures = [
    "matplotlib>=3.10.9",
]
