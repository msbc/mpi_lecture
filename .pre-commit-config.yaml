# Run on every commit after "pre-commit install"; run on everything with
#   pre-commit run --all-files
repos:
  # Python: lint and format (settings in .ruff.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0  # match the local ruff
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # C: format (settings in .clang-format)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8  # match the local clang-format
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # Fortran: lint (settings in fortitude.toml)
  - repo: https://github.com/PlasmaFAIR/fortitude-pre-commit
    rev: v0.9.2
    hooks:
      - id: fortitude
        args: [--fix]
        exclude: ^Intro_MPI/shared/  # fragments, checked where they are copied

  # C: lint as both C and C++ (settings in .clang-tidy). The compile flags
  # come from Intro_MPI/C/compile_commands.json, which make regenerates with
  # bear whenever a source or the Makefile changes.
  - repo: local
    hooks:
      - id: clang-tidy-c
        name: clang-tidy (as C)
        language: system
        types: [c]
        exclude: ^Intro_MPI/shared/
        require_serial: true
        entry: bash -c 'make -s -C Intro_MPI/C compile_commands.json && clang-tidy --quiet "$@"' --
      - id: clang-tidy-cxx
        name: clang-tidy (as C++)
        language: system
        types: [c]
        exclude: ^Intro_MPI/shared/
        require_serial: true
        entry: >-
          bash -c 'make -s -C Intro_MPI/C compile_commands.json &&
          clang-tidy --quiet --extra-arg-before=-xc++ --extra-arg=-std=c++17 "$@"' --

  # Exercises: the code in Intro_MPI/shared must match every copy of it
  - repo: local
    hooks:
      - id: sync-shared
        name: shared code is copied into every exercise
        language: system
        files: ^Intro_MPI/.*\.(c|f90)$
        pass_filenames: false
        entry: python3 ci/sync_shared.py --check

  # Slides: code listed on a slide must match the exercise file it comes from
  - repo: local
    hooks:
      - id: check-slides
        name: slide code matches the exercises
        language: system
        files: ^(slides\.py|Intro_MPI/.*\.(c|f90))$
        pass_filenames: false
        entry: python3 ci/check_slides.py
